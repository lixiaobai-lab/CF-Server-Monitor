# 部署准备文件：应用到 CF-Server-Monitor 稳定版仓库根目录后使用。
# API_SECRET 通过 Cloudflare 加密 Secret 设置，不得加入此文件的 vars。
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false
preview_urls = false

routes = [
  { pattern = "monitor.parleychat.com", custom_domain = true }
]

[secrets]
required = ["API_SECRET"]

[assets]
directory = "./dist"
binding = "ASSETS"

[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "a867d294-a764-42af-a433-c2c590d557e7"

[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]
